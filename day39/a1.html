<html>
    <body>

        <h2>JavaScript Number</h2>
        <p>The toString() method can output numbers from base 2 to 36:</p>
        <p id='demo'></p>

        
        <script>
            let myNumber = 32;
            document.getElementById('demo').innerHTML =
            'Decimal 32 (base 36):' + "<br><br>" + myNumber.toString(36) + "<br>" +
            'Duotrigesimal (base 32):' + myNumber.toString(32) + "<br>" 
            'Hexadecimal (base 16):' + myNumber.toString(16) + "<br>" +
            'Duodecimal (base 10):' + myNumber.toString(12) + "<br>" +
            "Octal (base10):" + myNumber.toString(10) + "<br>" + 
            "Binary (base 2):"
         </script>


    </body>
</html>
